<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 웹사이트 기본 설명 - 검색 결과에 표시됨 -->
    <meta name="description" content="memegle - gif search engine for you" />
    <!-- PWA를 위한 테마 색상 설정 -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph 메타태그 - 소셜 미디어 공유 시 표시되는 정보 -->
    <meta property="og:title" content="memegle - gif search engine for you" />
    <meta property="og:description" content="Search and share gifs" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-site-url.com" />
    <meta property="og:image" content="https://your-site-url.com/og-image.jpg" />

    <!-- 트위터 카드 설정 - 트위터에서 공유 시 표시되는 형식 -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 파비콘 설정 -->
    <link rel="icon" href="./public/favicon.ico" />
    <!-- 구글 폰트 최적화를 위한 사전 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- 페이지 제목 -->
    <title>memegle - gif search engine for you</title>
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
