<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="<%= typeof faviconUrl === 'undefined' ? publicPath + 'public/favicon.ico' : faviconUrl %>" />
    <script>
      (() => {
        const normalizePath = (path) => path.replace(/\/+$/, '').toLowerCase() || '/';
        const currentPath = normalizePath(window.location.pathname);
        const homePath = normalizePath('<%= publicPath %>');
        const isSearch = currentPath === normalizePath('<%= publicPath %>search');

        <% if (typeof searchMarkup !== 'undefined' && searchMarkup) { %>
        if (isSearch) {
          const style = document.createElement('style');
          style.textContent = <%= JSON.stringify(searchCriticalCss).replace(/</g, '\\u003c') %>;
          document.head.appendChild(style);
          // Tell webpack these extracted styles are already present during hydration.
          for (const href of <%= JSON.stringify(searchStyleAssets) %>) {
            const marker = document.createElement('style');
            marker.setAttribute('data-href', href);
            document.head.appendChild(marker);
          }
        } else {
          for (const href of <%= JSON.stringify(htmlWebpackPlugin.files.js) %>) {
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'script';
            preload.href = href;
            document.head.appendChild(preload);
          }
          for (const href of <%= JSON.stringify(htmlWebpackPlugin.files.css) %>) {
            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = href;
            stylesheet.setAttribute('blocking', 'render');
            document.head.appendChild(stylesheet);
          }
        }
        <% } %>

        if (isSearch) {
          const preconnect = document.createElement('link');
          preconnect.rel = 'preconnect';
          preconnect.href = 'https://api.giphy.com';
          preconnect.crossOrigin = 'anonymous';
          document.head.appendChild(preconnect);

          const trendingUrl = <%= JSON.stringify(require('./src/apis/giphyConfig.ts').TRENDING_URL) %>;
          if (trendingUrl !== '') {
            const response = fetch(trendingUrl);
            window.memegleTrendingRequest = { url: trendingUrl, response };

            // Discover the real first card image before the React bundle finishes loading.
            response
              .then(async (result) => {
                if (!result.ok || normalizePath(window.location.pathname) !== currentPath) return;
                const { data } = await result.clone().json();
                const gif = data?.[0];
                if (!gif) return;

                const images = gif.images;
                const poster = images.fixed_width_still?.url ?? images.original_still?.url;
                const imageUrl =
                  !gif.is_sticker && images.fixed_width?.mp4 && poster
                    ? poster
                    : images.fixed_width?.webp ?? images.fixed_width?.url ?? images.original.url;
                const preload = document.createElement('link');
                preload.rel = 'preload';
                preload.as = 'image';
                preload.href = imageUrl;
                preload.setAttribute('fetchpriority', 'high');
                document.head.appendChild(preload);
              })
              .catch(() => {});
          }

          <% if (typeof searchMarkup === 'undefined' || !searchMarkup) { %>
          // Development has no prerender, so start loading the Search route now.
          const searchAssets = <%= JSON.stringify(searchAssets) %>;
          for (const asset of searchAssets) {
            if (asset.endsWith('.js')) {
              const script = document.createElement('script');
              script.src = asset;
              script.async = false;
              document.head.appendChild(script);
              continue;
            }
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'style';
            preload.href = asset;
            document.head.appendChild(preload);
          }
          <% } %>
        }

        // Preload before React starts, only when opening the Home route.
        if (currentPath !== homePath) return;

        const fonts = [
          "<%= require('./src/assets/fonts/josefin-sans-latin-normal.woff2') %>",
          "<%= require('./src/assets/fonts/josefin-sans-latin-italic.woff2') %>"
        ];
        for (const font of fonts) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          preload.href = font;
          document.head.appendChild(preload);
        }

        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = "<%= require('./src/pages/Home/assets/hero.webp') %>";
        preload.imageSrcset =
          "<%= require('./src/pages/Home/assets/hero-mobile.webp') %> 720w, <%= require('./src/pages/Home/assets/hero.webp') %> 1440w";
        preload.imageSizes = '100vw';
        preload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(preload);
      })();
    </script>
    <title>memegle - gif search engine for you</title>
  </head>

  <body>
    <div id="app"></div>
    <% if (typeof searchMarkup !== 'undefined' && searchMarkup) { %>
    <template id="search-prerender"><%= searchMarkup %></template>
    <script>
      (() => {
        const normalizePath = (path) => path.replace(/\/+$/, '').toLowerCase() || '/';
        const isSearch = normalizePath(window.location.pathname) === normalizePath('<%= publicPath %>search');
        const loadApp = () => {
          const initialScripts = <%= JSON.stringify(htmlWebpackPlugin.files.js) %>;
          const searchScripts = isSearch
            ? <%= JSON.stringify(searchAssets.filter((asset) => asset.endsWith('.js'))) %>
            : [];
          for (const src of [...initialScripts, ...searchScripts]) {
            const script = document.createElement('script');
            script.src = src;
            script.async = false;
            document.head.appendChild(script);
          }
        };

        if (isSearch) {
          const app = document.getElementById('app');
          app.dataset.prerendered = 'search';
          app.appendChild(document.getElementById('search-prerender').content.cloneNode(true));

          // Keep a submission made while the hydration bundles are still loading.
          const input = document.getElementById('gif-search-input');
          const rememberSearch = (event) => {
            const submitted = event.type === 'click'
              ? event.target.closest('#gif-search-submit')
              : event.target === input && event.key === 'Enter';
            if (!submitted) return;
            event.preventDefault();
            event.stopPropagation();
            input.dataset.pendingSearch = input.value;
          };
          document.addEventListener('click', rememberSearch, true);
          document.addEventListener('keyup', rememberSearch, true);
          document.addEventListener('memegle:search-hydrated', () => {
            document.removeEventListener('click', rememberSearch, true);
            document.removeEventListener('keyup', rememberSearch, true);
          }, { once: true });

          // Prioritize the real Search UI, its font and API request. Hydration
          // bundles are requested after this screen has had a chance to paint.
          if (document.visibilityState === 'hidden') loadApp();
          else requestAnimationFrame(() => requestAnimationFrame(loadApp));
        } else {
          loadApp();
        }
        document.getElementById('search-prerender').remove();
      })();
    </script>
    <% } %>
  </body>
</html>
